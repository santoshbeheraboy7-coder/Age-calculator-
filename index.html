<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09091b">
  <title>Age Calculator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🎂</div>
    <p class="eyebrow">FREE ONLINE TOOL</p>
    <h1>Age Calculator <span>Pro</span></h1>
    <p class="subtitle">Discover your exact age in seconds.</p>

    <label for="dob">Enter your date of birth</label>
    <input type="date" id="dob">
    <button id="calculateBtn" type="button">Calculate My Age <span>✦</span></button>

    <section id="output" class="output" aria-live="polite" hidden>
      <h2>Your exact age</h2>
      <div class="result-grid">
        <div class="result-box"><strong id="years">0</strong><span>Years</span></div>
        <div class="result-box"><strong id="months">0</strong><span>Months</span></div>
        <div class="result-box"><strong id="days">0</strong><span>Days</span></div>
      </div>
      <p class="total-days">Total days lived: <strong id="totalDays">0</strong></p>
      <button id="copyBtn" class="copy-btn" type="button">Copy Result</button>
    </section>
    <p id="message" class="message" role="status"></p>
    <footer>Age Calculator Pro · Your date stays in your browser</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
